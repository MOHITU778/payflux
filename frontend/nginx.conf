server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  # Applies to responses served directly from this level.
  include /etc/nginx/conf.d/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build artefacts are immutable — cache them for a year.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # index.html must never be cached, or a deploy would leave browsers loading an
  # old shell that references bundle hashes which no longer exist.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  # Proxy the API so the browser sees one origin and CORS never applies.
  location /api/ {
    include /etc/nginx/conf.d/security-headers.conf;
    proxy_pass         http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # The API trusts exactly one proxy hop and reads the client IP from here —
    # rate limiting and the fraud engine's IP rules depend on it being correct.
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health { proxy_pass http://api:4000/health; }

  # Angular is a single-page app: every unmatched path must return index.html so
  # the client-side router can handle it, otherwise refreshing on /transactions
  # would 404.
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
