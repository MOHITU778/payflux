# Security headers.
#
# nginx's `add_header` is NOT inherited into a location block that declares any
# `add_header` of its own — it replaces the inherited set entirely. That silently
# strips security headers from exactly the locations most likely to set caching
# headers. Keeping them in one file and `include`-ing it in every such location
# is the only reliable way to guarantee they are always present.
add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "DENY"                             always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
